<!doctype html><html lang="ru"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>Innowise Calculator</title><script defer="defer" src="main.js"></script></head><body data-theme="dark"><div class="calc"><div class="calc__screen"><div class="theme-switch"><label class="theme-toggle"><span class="theme__name">Тема</span> <input type="checkbox" class="theme-toggle__checkbox"/><div class="theme-toggle__container"><div class="theme-toggle__track"></div><div class="theme-toggle__thumb"></div></div></label></div><p class="calc__display">0</p></div><div class="calc__buttons"><button class="calc__btn calc__btn--ac calc__btn--grey">AC</button> <button class="calc__btn calc__btn--plus-minus calc__btn--grey">+/-</button> <button class="calc__btn calc__btn--percent calc__btn--grey">%</button> <button class="calc__btn calc__btn--division calc__btn--orange">/</button> <button class="calc__btn calc__btn--number calc__btn--seven">7</button> <button class="calc__btn calc__btn--number calc__btn--eight">8</button> <button class="calc__btn calc__btn--number calc__btn--nine">9</button> <button class="calc__btn calc__btn--multiply calc__btn--orange">Х</button> <button class="calc__btn calc__btn--number calc__btn--four">4</button> <button class="calc__btn calc__btn--number calc__btn--five">5</button> <button class="calc__btn calc__btn--number calc__btn--six">6</button> <button class="calc__btn calc__btn--minus calc__btn--orange">-</button> <button class="calc__btn calc__btn--number calc__btn--one">1</button> <button class="calc__btn calc__btn--number calc__btn--two">2</button> <button class="calc__btn calc__btn--number calc__btn--three">3</button> <button class="calc__btn calc__btn--plus calc__btn--orange">+</button> <button class="calc__btn calc__btn--number calc__btn--zero">0</button> <button class="calc__btn calc__btn--dot">.</button> <button class="calc__btn calc__btn--equal calc__btn--orange">=</button></div></div></body></html>
